name: Installation

# Spielt deploy/install.sh auf einem nachgebauten Raspberry Pi durch, auf dem schon Homebridge läuft
# (Debian mit systemd im Container; der echte Pi hat arm64, hier ist es amd64 – sonst gleich).
# Tailscale wird übersprungen, weil dafür eine Anmeldung nötig ist.

# Nur, wenn sich etwas an der Installation ändert – und nur im PR (nach dem Merge nicht noch einmal dasselbe).
# Der Rest der App wird schon von "Tests" gestartet und geprüft. Von Hand: Actions → Installation → Run workflow.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'db/migrations/**'
      - 'package.json'
      - 'src/server/main.ts'
      - 'src/server/cli.ts'
      - 'src/server/config.ts'
      - '.github/workflows/installation.yml'
  workflow_dispatch:

concurrency:
  group: installation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    name: Neben Homebridge (Debian ${{ matrix.debian }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]   # Debian 12 und 13 – darauf bauen Raspberry Pi OS und Homebridge OS auf
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Pi-Ersatz starten (Debian mit systemd)
        run: |
          docker build -q -t pi --build-arg DEBIAN=${{ matrix.debian }} - <<'EOF'
          ARG DEBIAN
          FROM debian:${DEBIAN}
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                systemd systemd-sysv dbus sudo curl ca-certificates gnupg git netcat-openbsd \
           && rm -rf /var/lib/apt/lists/*
          CMD ["/lib/systemd/systemd"]
          EOF
          # Code wie von GitHub: eine Kopie, die als "origin" dient (für "tippspiel update")
          cp -a "$GITHUB_WORKSPACE" /tmp/quelle
          # Im PR ist der Code ohne Zweig ausgecheckt – der Pi braucht aber einen (origin/main), sonst bricht "tippspiel update" ab
          git -C /tmp/quelle checkout -q -B main
          git -C /tmp/quelle remote set-url origin /quelle
          docker run -d --name pi --hostname homebridge --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock -v /tmp/quelle:/quelle pi
          for _ in $(seq 60); do
            docker exec pi systemctl is-system-running 2>/dev/null | grep -qE 'running|degraded' && break
            sleep 1
          done
          docker exec pi git config --system --add safe.directory '*'

      - name: Homebridge installieren (wie auf Homebridge OS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Paketquelle von Homebridge (mit Wiederholungen); ist sie nicht erreichbar, dasselbe Paket
          # aus den GitHub-Releases von homebridge-apt-pkg – sonst wird jeder PR rot, wenn deren Server hängt
          if ! docker exec pi bash -euo pipefail -c '
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 https://repo.homebridge.io/KEY.gpg | gpg --dearmor > /usr/share/keyrings/homebridge.gpg
            echo "deb [signed-by=/usr/share/keyrings/homebridge.gpg] https://repo.homebridge.io stable main" \
              > /etc/apt/sources.list.d/homebridge.list
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q homebridge >/dev/null
          '; then
            echo "::warning::repo.homebridge.io nicht erreichbar – Homebridge aus den GitHub-Releases"
            docker exec pi rm -f /etc/apt/sources.list.d/homebridge.list
            url=$(gh api repos/homebridge/homebridge-apt-pkg/releases/latest \
              --jq '[.assets[] | select(.name | endswith("_amd64.deb"))][0].browser_download_url')
            curl -sSfL --retry 3 -o /tmp/homebridge.deb "$url"
            docker cp /tmp/homebridge.deb pi:/tmp/homebridge.deb
            docker exec pi bash -euo pipefail -c '
              apt-get update -q
              DEBIAN_FRONTEND=noninteractive apt-get install -y -q /tmp/homebridge.deb >/dev/null
            '
          fi
          for _ in $(seq 60); do docker exec pi curl -fsS -o /dev/null http://127.0.0.1:8581 && break; sleep 2; done
          docker exec pi curl -fsS -o /dev/null http://127.0.0.1:8581
          docker exec pi /opt/homebridge/bin/node -v | tee /tmp/homebridge-node-vorher
          # Port 3000 ist belegt – die App muss auf einen freien ausweichen
          docker exec pi systemd-run --unit=belegt nc -lk 3000

      - name: Tippspiel installieren
        run: docker exec -e ADMIN_EMAIL=admin@example.org -e GMAIL= -e OHNE_TAILSCALE=1 pi bash /quelle/deploy/install.sh

      - name: App läuft, Homebridge unverändert
        run: |
          set -x
          docker exec pi grep -x 'PORT=3001' /opt/lol-tippspiel/.env
          docker exec pi systemctl is-active lol-tippspiel
          docker exec pi curl -fsS http://127.0.0.1:3001/gesund
          docker exec pi curl -fsS -o /dev/null http://127.0.0.1:3001/
          docker exec pi tippspiel login-link admin@example.org | grep -q 'http://127.0.0.1:3001/'
          docker exec pi tippspiel status
          docker exec pi systemctl is-active homebridge
          docker exec pi curl -fsS -o /dev/null http://127.0.0.1:8581
          test "$(docker exec pi /opt/homebridge/bin/node -v)" = "$(cat /tmp/homebridge-node-vorher)"

      - name: Turnierdaten einspielen (zweimal)
        run: |
          docker exec pi tippspiel daten
          docker exec pi tippspiel daten worlds-2026
          docker exec pi tippspiel daten worlds-2026 | tee /tmp/daten
          grep -q '46 unverändert' /tmp/daten
          test "$(docker exec pi runuser -u postgres -- psql -d tippspiel -XAtc 'select count(*) from matches')" = 46

      - name: Datenabgleich mit Riot (echte Quellen)
        run: |
          docker exec pi tippspiel abgleich | tee /tmp/abgleich
          grep -q 'Spieler aus 19 von 19 Teams' /tmp/abgleich
          ! grep -q 'Fehler' /tmp/abgleich
          test "$(docker exec pi runuser -u postgres -- psql -d tippspiel -XAtc 'select count(*) >= 150 from champions')" = t

      - name: Zweiter Lauf behält Einstellungen
        run: |
          docker exec pi sha256sum /opt/lol-tippspiel/.env > /tmp/env-vorher
          docker exec -e OHNE_TAILSCALE=1 pi bash /opt/lol-tippspiel/deploy/install.sh
          docker exec pi sha256sum /opt/lol-tippspiel/.env | diff - /tmp/env-vorher
          docker exec pi curl -fsS http://127.0.0.1:3001/gesund

      - name: Sicherung und Wiederherstellen
        run: |
          docker exec pi tippspiel sicherung
          datei=$(docker exec pi bash -c 'ls -t /var/backups/lol-tippspiel/tippspiel-*.dump | head -n 1')
          docker exec pi runuser -u postgres -- psql -d tippspiel -Xqc "insert into teams (name) values ('Nach der Sicherung')"
          echo JA | docker exec -i pi tippspiel wiederherstellen "$datei"
          test "$(docker exec pi runuser -u postgres -- psql -d tippspiel -XAtc "select count(*) from teams where name = 'Nach der Sicherung'")" = 0
          docker exec pi curl -fsS http://127.0.0.1:3001/gesund

      - name: Update auf eine neue Version
        run: |
          cd /tmp/quelle
          # Viele neue Commits (wie beim Umzug auf ein neues Repository): die Liste der Neuerungen
          # darf das Update nicht abbrechen (früher: "git log | head" + pipefail = stiller Abbruch)
          lang=$(printf 'Beschreibung %.0s' $(seq 10))
          for i in $(seq 80); do
            echo "<!-- Test $i -->" >> README.md
            git -c user.name=Test -c user.email=test@example.org commit -qam "Test: neue Version $i – $lang"
          done
          docker exec pi tippspiel update | tee /tmp/update
          grep -q 'Update fertig' /tmp/update
          test "$(docker exec pi git -C /opt/lol-tippspiel rev-parse HEAD)" = "$(git rev-parse HEAD)"
          docker exec pi curl -fsS http://127.0.0.1:3001/gesund

      - name: Kaputtes Update wird zurückgenommen
        run: |
          cd /tmp/quelle
          gut=$(git rev-parse HEAD)
          sed -i '1i throw new Error("absichtlich kaputt");' src/server/main.ts
          git -c user.name=Test -c user.email=test@example.org commit -qam "Test: kaputte Version"
          if docker exec pi tippspiel update; then echo "Das Update hätte scheitern müssen"; exit 1; fi
          test "$(docker exec pi git -C /opt/lol-tippspiel rev-parse HEAD)" = "$gut"
          docker exec pi curl -fsS http://127.0.0.1:3001/gesund
          docker exec pi systemctl is-active homebridge

      - name: Auto-Update holt nur geprüfte Versionen (Zweig stabil)
        run: |
          cd /tmp/quelle
          G="git -c user.name=Test -c user.email=test@example.org"
          gut=$(git rev-parse HEAD~1)
          $G revert --no-edit HEAD >/dev/null
          python3 -c "import json; p='db/daten/worlds-2026.json'; d=json.load(open(p)); [m for m in d['matches'] if m['key']=='finale'][0].update(scheduled_at='2026-11-14T15:00:00-05:00'); json.dump(d, open(p,'w'), ensure_ascii=False, indent=1)"
          $G commit -qam "Test: geprüfte Version mit geänderten Turnierdaten"
          geprueft=$(git rev-parse HEAD)
          echo "<!-- ungeprüft -->" >> README.md
          $G commit -qam "Test: noch nicht geprüft"
          docker exec pi systemctl is-enabled lol-tippspiel-update.timer
          # stabil = installierte Version: nichts zu tun, keine Ausgabe
          git branch -f stabil "$gut"
          test -z "$(docker exec pi tippspiel update --auto)"
          test "$(docker exec pi git -C /opt/lol-tippspiel rev-parse HEAD)" = "$gut"
          # stabil rückt vor: der Zeitplan holt genau diese Version (nicht die ungeprüfte) und spielt die Turnierdaten ein
          git branch -f stabil "$geprueft"
          docker exec pi systemctl start lol-tippspiel-update.service
          test "$(docker exec pi git -C /opt/lol-tippspiel rev-parse HEAD)" = "$geprueft"
          test "$(docker exec pi runuser -u postgres -- psql -d tippspiel -XAtc "select to_char(scheduled_at at time zone 'UTC', 'HH24:MI') from matches where external_id = 'finale'")" = "20:00"
          docker exec pi curl -fsS http://127.0.0.1:3001/gesund
          docker exec pi journalctl -u lol-tippspiel-update -n 20 --no-pager

      - name: Protokolle (nur bei Fehler)
        if: failure()
        run: |
          docker exec pi tail -n 80 /var/log/lol-tippspiel-install.log || true
          docker exec pi journalctl -u lol-tippspiel -n 60 --no-pager || true
          docker exec pi journalctl -u homebridge -n 30 --no-pager || true
          docker exec pi journalctl -u lol-tippspiel-update -n 40 --no-pager || true
          docker exec pi systemctl --failed --no-pager || true

name: Tests

on:
  push:
  pull_request:

jobs:
  logik:
    name: Logik und Typen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Typprüfung
        run: |
          npm install --no-save --no-package-lock typescript@6.0.3 @types/node@22
          npx tsc --noEmit

  datenbank:
    name: Datenbank und Web-App
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tippspiel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tippspiel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/test-db.sh
      - run: bash scripts/test-app.sh

name: Tests

on:
  push:
  pull_request:

jobs:
  logik:
    name: Logik und Typen (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]   # 24 = Version auf dem Raspberry Pi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Typprüfung
        run: |
          npm install --no-save --no-package-lock typescript@6.0.3 @types/node@22
          npx tsc --noEmit
      - name: Installations-Skripte prüfen
        if: matrix.node == 24
        run: |
          # Fundstellen erscheinen als Hinweise direkt an der Datei
          out=$(shellcheck --severity=warning --format=gcc deploy/install.sh deploy/tippspiel scripts/*.sh) && exit 0
          echo "$out" | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'
          exit 1

  datenbank:
    name: Datenbank und Web-App (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tippspiel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tippspiel_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bash scripts/test-db.sh
      - run: bash scripts/test-app.sh

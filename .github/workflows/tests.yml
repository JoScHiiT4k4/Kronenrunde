name: Tests

# Nur bei Änderungsvorschlägen (PR) und auf main – nicht doppelt für jeden Zweig (spart Rechenzeit/Kosten bei GitHub)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  logik:
    name: Logik und Typen (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]   # 24 = Version auf dem Raspberry Pi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Typprüfung
        run: |
          npm install --no-save --no-package-lock typescript@6.0.3 @types/node@22
          npx tsc --noEmit
      - name: Installations-Skripte prüfen
        if: matrix.node == 24
        run: |
          # Fundstellen erscheinen als Hinweise direkt an der Datei
          out=$(shellcheck --severity=warning --format=gcc deploy/install.sh deploy/tippspiel scripts/*.sh) && exit 0
          echo "$out" | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'
          exit 1

  datenbank:
    name: Datenbank und Web-App (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tippspiel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tippspiel_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bash scripts/test-db.sh
      - run: bash scripts/test-app.sh

  # Öffnet die App in einem echten Chrome bei Handy-, Tablet- und PC-Breiten, misst das Layout (Reiter bündig,
  # nichts ragt heraus, Rangliste da) und legt Screenshots ab. Bewusst NICHT Voraussetzung für die Freigabe:
  # Ein Fehler hier erscheint rot am Commit, hält Updates für den Pi aber nicht auf.
  browser:
    name: Browser-Prüfung (Layout und Screenshots)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tippspiel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tippspiel_test
      BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Chrome einrichten
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Seiten bei mehreren Fensterbreiten prüfen
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test src/server/browser.test.ts
      - name: Screenshots ablegen (werden nach 7 Tagen automatisch gelöscht)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: browser-screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # Sind alle Prüfungen grün, wird diese Version auf den Zweig "stabil" geschoben.
  # Nur von dort holt sich der Raspberry Pi automatisch neue Versionen (tippspiel update).
  freigeben:
    name: Als geprüft freigeben (Zweig stabil)
    needs: [logik, datenbank]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Zweig stabil nachziehen
        run: |
          git fetch -q origin stabil 2>/dev/null || true
          if git rev-parse -q --verify origin/stabil >/dev/null && ! git merge-base --is-ancestor origin/stabil "$GITHUB_SHA"; then
            echo "Der Zweig stabil ist schon auf einer neueren Version – nichts zu tun."
            exit 0
          fi
          git push -q origin "$GITHUB_SHA:refs/heads/stabil"
          echo "Freigegeben: $(git log -1 --format='%h %s' "$GITHUB_SHA")"
